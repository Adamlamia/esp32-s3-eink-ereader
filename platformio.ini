; PlatformIO Project Configuration File
; ---------------------------------------------------------------------------
; Target board : LILYGO T5 4.7" E-Paper S3 (ESP32-S3, 16MB flash, 8MB PSRAM)
; Panel        : ED047TC1 (960 x 540, 16 grayscale) driven by LilyGo-EPD47
; ---------------------------------------------------------------------------
; Build       : pio run
; Upload FW   : pio run -t upload
; Upload web  : pio run -t uploadfs   (flashes the /data folder to LittleFS)
; Monitor     : pio device monitor
; ---------------------------------------------------------------------------

[platformio]
default_envs = lilygo_t5_47_s3

[env:lilygo_t5_47_s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM layout for the T5 4.7" S3 -------------------------------
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi      ; enable OPI PSRAM
board_upload.flash_size         = 16MB
board_build.partitions          = partitions.csv
board_build.filesystem          = littlefs

; --- Compile flags ---------------------------------------------------------
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1        ; USB serial for the built-in monitor
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DCORE_DEBUG_LEVEL=3

; --- Libraries -------------------------------------------------------------
lib_deps =
    https://github.com/Xinyuan-LilyGo/LilyGo-EPD47.git
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.0

; --- Serial monitor --------------------------------------------------------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; ===========================================================================
; Optional variant: USB DRIVE MODE
; ---------------------------------------------------------------------------
; Exposes the microSD card as a USB mass-storage disk. Build & flash with:
;     pio run -e lilygo_t5_47_s3_usbdrive -t upload
; Then hold the BOOT button while plugging into a computer to mount the card.
; Uses TinyUSB (OTG) instead of the hardware CDC/JTAG serial bridge.
; ===========================================================================
[env:lilygo_t5_47_s3_usbdrive]
extends     = env:lilygo_t5_47_s3
build_flags =
    ${env:lilygo_t5_47_s3.build_flags}
    -DENABLE_USB_MSC=1
    -DARDUINO_USB_MODE=0

; ===========================================================================
; Host (native) unit tests  —  pure-logic seams, no hardware
; ---------------------------------------------------------------------------
;     pio test -e native
; Runs the Unity suites under test/ on the development machine (needs a host
; GCC/Clang toolchain). No Arduino, Wi-Fi, filesystem or EPD is touched: the
; seams in src/core/ are header-only and portable, so the tests include them
; directly and inject stubs/fakes for the measurement and storage boundaries.
;
; build_src_filter = -<*> keeps the firmware sources (which need Arduino.h) out
; of the host build; only src/core/*.h is pulled in via #include from the tests.
; ===========================================================================
[env:native]
platform       = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -DNATIVE_TEST=1
    -std=c++17
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
